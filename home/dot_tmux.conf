unbind C-b
set -g prefix C-a

bind C-c new-window
bind C-p previous-window
bind C-n next-window
bind C-d detach-client
bind C-a last-window
#bind C-b next-pane
bind a send-keys C-a

# Set status bar
set -g status-justify centre
set -g status-bg black
set -g status-fg white

set -g status-left-length 90
set -g status-left '#[bold,fg=blue][ #[default]#[fg=green]#H#[default] #[fg=yellow]::#[fg=magenta] {#[fg=green]#S#[fg=magenta]} #[bold,fg=blue]] ['

set -g status-right-length 70
set -g status-right '#[bold,fg=blue]] [ #[default,fg=green]#(date '+%m/%d') #[fg=yellow]#(date '+%H:%M') #[default,bold,fg=blue]]'

set-window-option -g window-status-current-format '#[fg=red](#[fg=cyan]#I#F#W#[fg=red]) '
set-window-option -g window-status-format '#[fg=green]#I#F#W '

# Automatically set window title
setw -g automatic-rename

# Set window notifications
#setw -g monitor-activity on
#set -g visual-activity on

# Set system bell to chime when anything changes
set-option -g bell-action any

# 256 color
set -g default-terminal "screen-256color"

# Allow mouse use
set -g mouse

# Bigger scrollback buffer
set -g history-limit 50000

# Kill the ESC delay that breaks vim mode-switching
set -g escape-time 10

# vi keys in copy/scroll mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Reload config from inside tmux
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Saner pane splits — open in current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Renumber windows when one is closed (no gaps)
set -g renumber-windows on

# Start indexing at 1 (easier on the keyboard)
set -g base-index 1
setw -g pane-base-index 1
